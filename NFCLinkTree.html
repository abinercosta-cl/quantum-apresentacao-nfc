ize: 18px; letter-spacing: -0.01em;\">NFC Link Tree<\u002Fspan>\n      <span style=\"font-size: 13px; color: {{ink2}}; padding-left: 10px; border-left: 1px solid {{line}}; margin-left: 2px;\">por Quantum<\u002Fspan>\n    <\u002Fdiv>\n    <a href=\"#contato\" class=\"ntl-btn ntl-nav-cta\" style=\"display: inline-flex; align-items: center; background: {{ink}}; color: {{bg}}; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 999px;\">Falar com a Quantum<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"padding: 96px 48px 88px; background: {{bg}};\">\n    <div class=\"ntl-hero-grid\" style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 72px; align-items: center;\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: {{bgAlt}}; border: 1px solid {{line}}; color: {{ink2}}; font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 7px 14px; border-radius: 999px; margin-bottom: 28px;\">\n          Cartão de visita digital com NFC\n        <\u002Fdiv>\n        <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 50px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 700; margin: 0 0 24px;\">\n          Seu negócio, a um toque de distância do cliente\n        <\u002Fh1>\n        <p style=\"font-size: 18px; line-height: 1.6; color: {{ink2}}; max-width: 46ch; margin: 0 0 36px;\">\n          Uma tag NFC ou um QR Code abrem, na hora, uma página só sua: links, WhatsApp, redes sociais e o botão para salvar seu contato direto na agenda. Sem aplicativo, sem digitar nada, sem cartão que se perde na carteira.\n        <\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px;\">\n          <a href=\"#contato\" class=\"ntl-btn\" style=\"display: inline-flex; align-items: center; background: {{accent}}; color: #FFFFFF; font-size: 15.5px; font-weight: 600; padding: 14px 26px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.08);\">Quero isso no meu negócio<\u002Fa>\n          <a href=\"#como-funciona\" class=\"ntl-btn ntl-link\" style=\"display: inline-flex; align-items: center; font-size: 15.5px; font-weight: 600; padding: 14px 10px; color: {{ink}};\">Ver como funciona ↓<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PHONE MOCKUP -->\n      <div style=\"display: flex; justify-content: center;\">\n        <div style=\"width: 280px; border-radius: 36px; background: #141311; padding: 14px; box-shadow: 0 30px 60px -20px rgba(20,19,17,0.35);\">\n          <div style=\"border-radius: 24px; background: {{bgAlt}}; overflow: hidden;\">\n            <div style=\"height: 150px; background: linear-gradient(180deg, {{accent}} 0%, {{accent}} 100%); position: relative;\">\n              <div style=\"position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\" stroke=\"#fff\" stroke-width=\"2\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\" stroke=\"#fff\" stroke-width=\"2\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\" stroke=\"#fff\" stroke-width=\"2\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"3\" height=\"3\" fill=\"#fff\"><\u002Frect><rect x=\"18\" y=\"14\" width=\"3\" height=\"3\" fill=\"#fff\"><\u002Frect><rect x=\"14\" y=\"18\" width=\"3\" height=\"3\" fill=\"#fff\"><\u002Frect><rect x=\"18\" y=\"18\" width=\"3\" height=\"3\" fill=\"#fff\"><\u002Frect><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); width: 68px; height: 68px; border-radius: 18px; background: {{bgAlt}}; border: 3px solid {{bgAlt}}; display: flex; align-items: center; justify-content: center;\">\n                <div style=\"width: 100%; height: 100%; border-radius: 15px; background: {{line}};\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 46px 20px 24px; text-align: center;\">\n              <div style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: {{ink}};\">Sua Empresa<\u002Fdiv>\n              <div style=\"font-size: 12px; color: {{ink2}}; margin-top: 4px; line-height: 1.4;\">Tapeçaria · Estofados · Acabamento automotivo<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 20px;\">\n                <div style=\"height: 38px; border-radius: 10px; background: #FFFFFF; border: 1px solid {{line}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: {{ink}};\">WhatsApp<\u002Fdiv>\n                <div style=\"height: 38px; border-radius: 10px; background: #FFFFFF; border: 1px solid {{line}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: {{ink}};\">Instagram<\u002Fdiv>\n                <div style=\"height: 38px; border-radius: 10px; background: #FFFFFF; border: 1px solid {{line}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: {{ink}};\">Google Meu Negócio<\u002Fdiv>\n                <div style=\"height: 38px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: #FFFFFF; margin-top: 4px;\">Salvar contato<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top: 18px; font-size: 10px; color: {{ink3}}; display: flex; align-items: center; justify-content: center; gap: 5px;\">\n                <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 16.5C7 12.9 9.9 10 13.5 10\" stroke=\"{{ink3}}\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M4 19.5C4 13.1 9.1 8 15.5 8\" stroke=\"{{ink3}}\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"><\u002Fpath><\u002Fsvg>\n                NFC Link Tree · Quantum\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PROBLEMA -->\n  <div style=\"padding: 88px 48px; background: {{bgAlt}}; border-top: 1px solid {{line}}; border-bottom: 1px solid {{line}};\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n      <div style=\"max-width: 640px; margin: 0 auto 48px; text-align: center;\">\n        <h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 14px;\">O jeito antigo de divulgar o contato do seu negócio tem limite<\u002Fh2>\n        <p style=\"font-size: 16px; color: {{ink2}}; line-height: 1.6; margin: 0;\">Cartão de papel, \"me chama no WhatsApp\" de cor e QR Code genérico resolvem só até certo ponto.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ntl-cols3\" style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;\">\n        <div style=\"background: {{bg}}; border: 1px solid {{line}}; border-radius: 16px; padding: 28px;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 10px; background: {{bgAlt}}; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M4 4h16v16H4z\" stroke=\"{{ink2}}\" stroke-width=\"1.6\"><\u002Fpath><path d=\"M8 9h8M8 13h5\" stroke=\"{{ink2}}\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-size: 16px; font-weight: 700; margin: 0 0 8px;\">Cartão impresso<\u002Fh3>\n          <p style=\"font-size: 14px; color: {{ink2}}; line-height: 1.55; margin: 0;\">Se perde na carteira, acaba a tiragem e, quando um número ou link muda, todos os cartões antigos ficam errados.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: {{bg}}; border: 1px solid {{line}}; border-radius: 16px; padding: 28px;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 10px; background: {{bgAlt}}; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M5 7h14M5 12h14M5 17h8\" stroke=\"{{ink2}}\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-size: 16px; font-weight: 700; margin: 0 0 8px;\">\"Me segue lá\", de cor<\u002Fh3>\n          <p style=\"font-size: 14px; color: {{ink2}}; line-height: 1.55; margin: 0;\">Passar usuário do Instagram ou número de telefone falado é fácil de errar na digitação e fácil de esquecer depois.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: {{bg}}; border: 1px solid {{line}}; border-radius: 16px; padding: 28px;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 10px; background: {{bgAlt}}; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"6\" height=\"6\" stroke=\"{{ink2}}\" stroke-width=\"1.6\"><\u002Frect><rect x=\"14\" y=\"4\" width=\"6\" height=\"6\" stroke=\"{{ink2}}\" stroke-width=\"1.6\"><\u002Frect><rect x=\"4\" y=\"14\" width=\"6\" height=\"6\" stroke=\"{{ink2}}\" stroke-width=\"1.6\"><\u002Frect><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-size: 16px; font-weight: 700; margin: 0 0 8px;\">QR Code solto, sem identidade<\u002Fh3>\n          <p style=\"font-size: 14px; color: {{ink2}}; line-height: 1.55; margin: 0;\">Aponta pra um link qualquer, sem a cor nem o nome da empresa — o cliente não sabe o que vai abrir até clicar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- COMO FUNCIONA -->\n  <div id=\"como-funciona\" style=\"padding: 96px 48px; background: {{bg}};\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n      <div style=\"max-width: 640px; margin: 0 auto 56px; text-align: center;\">\n        <h2 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 14px;\">Como funciona, na prática<\u002Fh2>\n        <p style=\"font-size: 16px; color: {{ink2}}; line-height: 1.6; margin: 0;\">Uma tag NFC — um adesivo ou cartão discreto — fica no balcão, na vitrine ou no próprio cartão de visita.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ntl-cols3\" style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px; position: relative;\">\n        <div>\n          <div style=\"width: 52px; height: 52px; border-radius: 14px; background: {{accent}}; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 20px;\">1<\u002Fdiv>\n          <h3 style=\"font-size: 17px; font-weight: 700; margin: 0 0 8px;\">Encosta o celular na tag<\u002Fh3>\n          <p style=\"font-size: 14.5px; color: {{ink2}}; line-height: 1.6; margin: 0;\">Ou aponta a câmera para o QR Code impresso ao lado — os dois caminhos levam ao mesmo lugar. Nenhum aplicativo precisa ser instalado.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"width: 52px; height: 52px; border-radius: 14px; background: {{accent}}; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 20px
